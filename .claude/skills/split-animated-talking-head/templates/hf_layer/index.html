<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=770" />
    <!-- HyperFrames overlay layer for the split-animated slot (1080x770 at canvas y=90).
         Transparent background: rendered with `--format png-sequence` and stacked on
         top of the PIL animation layer by media_marks.hf_layer_frame(n).
         GSAP timeline must be paused + registered on window.__timelines["hf"].
         Set data-duration to the clip DUR (source/meta.json). Coordinates are slot
         pixels: y=0 is canvas y=90, y=770 kisses the captions at y≈867.
         Words: use audio/words.json start times for every beat (max 0.1s lead). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 770px; overflow: hidden; background: transparent; }
      @font-face { font-family: "Oswald"; src: url("../fonts/Oswald-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
      body { font-family: "Oswald", "Arial Black", sans-serif; color: #1e1c1a; }
      .clip { position: absolute; will-change: transform, opacity; }
      /* brand tokens (same as the PIL renderer) */
      :root { --ink: #1e1c1a; --coral: #d96f4e; --paper: #efe8da; --sage: #aebfa8; --mint: #9fe3b4; }
      .hero { left: 60px; top: 380px; width: 960px; text-align: center; font-size: 150px; letter-spacing: 0.04em; text-transform: uppercase; color: #fff;
              background: var(--coral); border-radius: 36px; padding: 30px 0 22px; box-shadow: 0 12px 30px rgba(20,18,16,.28); }
      .hero small { display: block; font: 700 30px Oswald, sans-serif; letter-spacing: 0.04em; margin-top: -8px; opacity: .9; }
      .chip { padding: 12px 24px; border-radius: 16px; background: var(--ink); color: var(--mint); font: 700 28px Oswald, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
      .lt { left: 60px; top: 620px; background: var(--ink); color: #fff; padding: 14px 28px 14px 40px; border-radius: 18px; font-size: 40px; }
      .lt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--coral); border-radius: 18px 0 0 18px; }
      .lt small { display: block; font: 700 24px Oswald, sans-serif; opacity: .8; }
      .stat { left: 640px; top: 60px; font-size: 96px; color: var(--ink); }
      .stat em { font-style: normal; color: var(--coral); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hf" data-start="0" data-duration="8" data-width="1080" data-height="770">
      <!-- EXAMPLE BEATS — replace per script. Keep everything inside 36..1044 x. -->
      <div id="hero" class="clip hero" data-start="0.4" data-duration="2.4">$100<small>a month in subs</small></div>
      <div id="stat" class="clip stat" data-start="2.9" data-duration="2.2"><em id="statv">0</em>%</div>
      <div id="chip1" class="clip chip" style="left:60px; top:60px" data-start="0" data-duration="8">cancel the stack</div>
      <div id="lt" class="clip lt" data-start="5.2" data-duration="2.8">Dario Amodei<small>Anthropic CEO</small></div>
    </div>
    <script>
      // Seek-safe: single paused timeline, absolute positions, finite tweens only.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // cold open: chip already in place at t=0 (no ease-in on frame 0)
      tl.set("#chip1", { opacity: 1 }, 0);
      // hero: slam in with overshoot on the spoken word (0.4), fly up before next beat
      tl.from("#hero", { y: 90, scale: 1.25, opacity: 0, rotation: -3, duration: 0.3, ease: "back.out(2)" }, 0.4);
      tl.to("#hero", { y: -140, opacity: 0, duration: 0.22, ease: "power2.in" }, 2.6);
      // stat count-up (expo.out) on the number word
      const v = { n: 0 };
      tl.from("#stat", { x: 120, opacity: 0, duration: 0.25, ease: "power3.out" }, 2.9);
      tl.to(v, { n: 300, duration: 1.0, ease: "expo.out",
                 onUpdate: () => { document.getElementById("statv").textContent = Math.round(v.n); } }, 2.9);
      // lower third: wipe up
      tl.from("#lt", { y: 60, opacity: 0, duration: 0.3, ease: "power3.out" }, 5.2);
      window.__timelines["hf"] = tl;
    </script>
  </body>
</html>
